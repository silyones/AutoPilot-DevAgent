<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoPilot Dev — Autonomous PR Review</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#0d1117',
            surface: '#161b22',
            border: '#30363d',
            accent: '#58a6ff',
            success: '#3fb950',
            warn: '#d29922',
            danger: '#f85149',
            muted: '#8b949e',
          },
        },
      },
    };
  </script>
  <style>
    body { background: #0d1117; }
    @keyframes pulse-blue {
      0%, 100% { box-shadow: 0 0 0 0 rgba(88, 166, 255, 0.5); }
      50% { box-shadow: 0 0 16px 4px rgba(88, 166, 255, 0.35); }
    }
    .node-running { animation: pulse-blue 1.5s ease-in-out infinite; }
    .arrow-down::after {
      content: '↓';
      display: block;
      text-align: center;
      color: #8b949e;
      font-size: 1.25rem;
      line-height: 1;
      margin: 4px 0;
    }
    code, pre { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }

    @media print {
      body { background: #fff !important; color: #111 !important; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      #report-print {
        display: block !important;
        color: #111 !important;
        background: #fff !important;
      }
      #report-print * { color: #111 !important; }
      #report-print .bg-surface, #report-print .bg-bg, #report-print .bg-gray-900 {
        background: #f9f9f9 !important;
        border: 1px solid #ddd !important;
      }
      #report-print .text-white, #report-print .text-muted { color: #333 !important; }
      .node-running { animation: none !important; box-shadow: none !important; }
    }
    .print-only { display: none; }
  </style>
</head>
<body class="text-white min-h-screen">
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    const API = 'http://localhost:8000';

    const PIPELINE_NODES = [
      { id: 'fetcher', label: 'GitHub Fetcher', agents: ['GitHub Fetcher'] },
      { id: 'reviewer', label: 'Reviewer Agent', agents: ['Reviewer Agent'] },
      { id: 'fixer', label: 'Fixer Agent', agents: ['Fixer Agent'] },
      { id: 'tester', label: 'Tester Agent', agents: ['Tester Agent'] },
      { id: 'documenter', label: 'Documenter Agent', agents: ['Documenter Agent'] },
      { id: 'final', label: 'Final Report', agents: [] },
    ];

    const AGENT_TO_NODE = {};
    PIPELINE_NODES.forEach((n) => {
      n.agents.forEach((a) => { AGENT_TO_NODE[a] = n.id; });
    });

    const NODE_ORDER = PIPELINE_NODES.map((n) => n.id);

    const STATUS_STYLES = {
      WAITING: 'border-dashed border-gray-600 bg-gray-900/50 text-gray-400',
      RUNNING: 'border-accent bg-accent/10 text-accent node-running',
      DONE: 'border-success bg-success/10 text-success',
      FAILED: 'border-danger bg-danger/10 text-danger',
    };

    const SEVERITY_COLORS = {
      critical: 'text-red-400 bg-red-900/30',
      high: 'text-orange-400 bg-orange-900/30',
      medium: 'text-yellow-400 bg-yellow-900/30',
      low: 'text-gray-400 bg-gray-800/50',
    };

    function mapAgentToNode(agent) {
      if (!agent) return null;
      if (AGENT_TO_NODE[agent]) return AGENT_TO_NODE[agent];
      for (const [name, id] of Object.entries(AGENT_TO_NODE)) {
        if (agent.includes(name.split(' ')[0])) return id;
      }
      return null;
    }

    function initialNodeStates() {
      const s = {};
      PIPELINE_NODES.forEach((n) => { s[n.id] = 'WAITING'; });
      return s;
    }

    function statusBadgeClass(status) {
      const m = {
        'IN PROGRESS': 'bg-warn/20 text-warn border-warn/50',
        PASSED: 'bg-success/20 text-success border-success/50',
        FIXED: 'bg-accent/20 text-accent border-accent/50',
        NEEDS_HUMAN_REVIEW: 'bg-danger/20 text-danger border-danger/50',
        ERROR: 'bg-danger/20 text-danger border-danger/50',
      };
      return m[status] || 'bg-gray-800 text-muted border-border';
    }

    function formatStatus(s) {
      if (s === 'NEEDS_HUMAN_REVIEW') return 'NEEDS HUMAN REVIEW';
      return s || 'IDLE';
    }

    // ── Pipeline Node ─────────────────────────────────────────────────────
    function PipelineNode({ label, state }) {
      const cls = STATUS_STYLES[state] || STATUS_STYLES.WAITING;
      return (
        <div className={`rounded-lg border-2 px-4 py-3 text-center text-sm font-semibold transition-all duration-300 ${cls}`}>
          {state === 'DONE' && <span className="mr-1">✓</span>}
          {state === 'FAILED' && <span className="mr-1">✗</span>}
          {label}
        </div>
      );
    }

    // ── Pipeline Diagram ──────────────────────────────────────────────────
    function PipelineDiagram({ nodeStates, retryActive }) {
      return (
        <div className="flex flex-col items-center w-full max-w-xs mx-auto">
          {PIPELINE_NODES.map((node, i) => (
            <React.Fragment key={node.id}>
              <PipelineNode label={node.label} state={nodeStates[node.id]} />
              {node.id === 'fixer' && i < PIPELINE_NODES.length - 1 && (
                <div className="relative w-full flex justify-center my-1">
                  <div className="arrow-down" />
                  {retryActive && (
                    <div className="absolute right-0 top-1/2 -translate-y-1/2 text-xs text-warn border border-warn/40 rounded px-2 py-1 whitespace-nowrap">
                      ↺ retry loop
                    </div>
                  )}
                </div>
              )}
              {node.id === 'tester' && (
                <div className="relative w-full">
                  <div className="arrow-down" />
                  {retryActive && (
                    <svg className="absolute -right-16 top-0 h-16 w-16 text-warn/60" viewBox="0 0 64 64" fill="none">
                      <path d="M8 32 C8 8, 56 8, 56 32" stroke="currentColor" strokeWidth="2" strokeDasharray="4 3" markerEnd="url(#arrow)" />
                      <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="currentColor" /></marker></defs>
                    </svg>
                  )}
                </div>
              )}
              {node.id !== 'fixer' && node.id !== 'tester' && i < PIPELINE_NODES.length - 1 && (
                <div className="arrow-down" />
              )}
            </React.Fragment>
          ))}
        </div>
      );
    }

    // ── Report Sections ───────────────────────────────────────────────────
    function SummaryCards({ report }) {
      const review = report.review || {};
      const findings = review.findings || [];
      const severity = { critical: 0, high: 0, medium: 0, low: 0 };
      findings.forEach((f) => {
        const s = (f.severity || 'low').toLowerCase();
        if (severity[s] !== undefined) severity[s]++;
      });
      const patches = report.patches || [];
      const tests = report.test_results || {};

      return (
        <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div className="bg-surface border border-border rounded-lg p-4">
            <div className="text-muted text-xs uppercase tracking-wide mb-1">Total Issues</div>
            <div className="text-2xl font-bold">{review.total_issues ?? findings.length}</div>
            <div className="text-xs text-muted mt-2 space-x-2">
              <span className="text-red-400">C:{severity.critical}</span>
              <span className="text-orange-400">H:{severity.high}</span>
              <span className="text-yellow-400">M:{severity.medium}</span>
              <span className="text-gray-400">L:{severity.low}</span>
            </div>
          </div>
          <div className="bg-surface border border-border rounded-lg p-4">
            <div className="text-muted text-xs uppercase tracking-wide mb-1">Patches Generated</div>
            <div className="text-2xl font-bold text-accent">{patches.length}</div>
          </div>
          <div className="bg-surface border border-border rounded-lg p-4">
            <div className="text-muted text-xs uppercase tracking-wide mb-1">Tests</div>
            <div className="text-2xl font-bold">
              <span className="text-success">{tests.passed ?? 0}</span>
              <span className="text-muted text-lg"> / </span>
              <span className="text-danger">{tests.failed ?? 0}</span>
            </div>
            <div className="text-xs text-muted mt-1">passed / failed</div>
          </div>
          <div className="bg-surface border border-border rounded-lg p-4">
            <div className="text-muted text-xs uppercase tracking-wide mb-1">Duration</div>
            <div className="text-2xl font-bold">{(report.total_duration_seconds || 0).toFixed(2)}s</div>
          </div>
        </div>
      );
    }

    function FindingsTable({ findings }) {
      if (!findings || findings.length === 0) {
        return <p className="text-muted text-sm">No findings reported.</p>;
      }
      return (
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-border text-muted text-left">
                <th className="py-2 pr-3">Severity</th>
                <th className="py-2 pr-3">File</th>
                <th className="py-2 pr-3">Line</th>
                <th className="py-2 pr-3">Category</th>
                <th className="py-2">Description</th>
              </tr>
            </thead>
            <tbody>
              {findings.map((f, i) => {
                const sev = (f.severity || 'low').toLowerCase();
                const sevCls = SEVERITY_COLORS[sev] || SEVERITY_COLORS.low;
                return (
                  <tr key={i} className="border-b border-border/50">
                    <td className="py-2 pr-3"><span className={`px-2 py-0.5 rounded text-xs font-semibold uppercase ${sevCls}`}>{f.severity}</span></td>
                    <td className="py-2 pr-3 font-mono text-xs text-accent">{f.file}</td>
                    <td className="py-2 pr-3 text-muted">{f.line}</td>
                    <td className="py-2 pr-3 text-muted">{f.category}</td>
                    <td className="py-2">{f.description}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      );
    }

    function PatchesSection({ patches }) {
      if (!patches || patches.length === 0) {
        return <p className="text-muted text-sm">No patches generated.</p>;
      }
      return (
        <div className="space-y-6">
          {patches.map((p, i) => (
            <div key={i} className="bg-surface border border-border rounded-lg p-4">
              <div className="font-mono text-sm text-accent mb-3">📄 {p.file}</div>
              <div className="grid md:grid-cols-2 gap-3 mb-3">
                <div>
                  <div className="text-xs text-muted mb-1 uppercase">Original</div>
                  <pre className="bg-red-950/40 border border-red-900/50 rounded p-3 text-xs overflow-x-auto whitespace-pre-wrap">{p.original}</pre>
                </div>
                <div>
                  <div className="text-xs text-muted mb-1 uppercase">Fixed</div>
                  <pre className="bg-green-950/40 border border-green-900/50 rounded p-3 text-xs overflow-x-auto whitespace-pre-wrap">{p.fixed}</pre>
                </div>
              </div>
              {p.explanation && <p className="text-sm text-muted">{p.explanation}</p>}
            </div>
          ))}
        </div>
      );
    }

    function DocumentationSection({ doc }) {
      if (!doc) return <p className="text-muted text-sm">No documentation generated.</p>;
      const docstrings = typeof doc.docstrings === 'string' ? doc.docstrings : JSON.stringify(doc.docstrings, null, 2);
      return (
        <div className="space-y-4">
          {doc.summary && (
            <div>
              <h4 className="text-xs uppercase text-muted mb-2">Summary</h4>
              <p className="text-sm leading-relaxed">{doc.summary}</p>
            </div>
          )}
          {doc.changelog && (
            <div>
              <h4 className="text-xs uppercase text-muted mb-2">Changelog</h4>
              <pre className="bg-surface border border-border rounded p-3 text-xs whitespace-pre-wrap">{doc.changelog}</pre>
            </div>
          )}
          {docstrings && (
            <div>
              <h4 className="text-xs uppercase text-muted mb-2">Docstrings</h4>
              <pre className="bg-surface border border-border rounded p-3 text-xs overflow-x-auto whitespace-pre-wrap">{docstrings}</pre>
            </div>
          )}
        </div>
      );
    }

    function AgentTimeline({ trace }) {
      if (!trace || trace.length === 0) return null;
      return (
        <div className="overflow-x-auto pb-2">
          <div className="flex items-start gap-0 min-w-max">
            {trace.map((step, i) => (
              <React.Fragment key={i}>
                <div className="flex flex-col items-center w-36 shrink-0">
                  <div className="w-3 h-3 rounded-full bg-accent mb-2" />
                  <div className="text-xs font-semibold text-center">{step.agent}</div>
                  <div className="text-xs text-muted text-center mt-1">{step.action}</div>
                  <div className="text-xs text-muted/60 text-center mt-1 font-mono">
                    {step.timestamp ? new Date(step.timestamp).toLocaleTimeString() : ''}
                  </div>
                </div>
                {i < trace.length - 1 && (
                  <div className="flex items-center pt-1 px-1">
                    <div className="w-8 h-0.5 bg-border" />
                    <span className="text-muted text-xs">→</span>
                    <div className="w-8 h-0.5 bg-border" />
                  </div>
                )}
              </React.Fragment>
            ))}
          </div>
        </div>
      );
    }

    function ReportPanel({ report }) {
      if (!report) return null;
      return (
        <div id="report-print" className="space-y-8 mt-8">
          <div className="flex items-center justify-between">
            <h2 className="text-lg font-bold">DevReport</h2>
            <button
              onClick={() => window.print()}
              className="no-print bg-accent hover:bg-accent/80 text-bg font-semibold px-4 py-2 rounded-lg text-sm transition"
            >
              Download Report as PDF
            </button>
          </div>
          <p className="text-sm text-muted font-mono">{report.pr_url}</p>

          <section>
            <h3 className="text-sm font-semibold text-muted uppercase tracking-wide mb-3">Summary</h3>
            <SummaryCards report={report} />
          </section>

          <section>
            <h3 className="text-sm font-semibold text-muted uppercase tracking-wide mb-3">Findings</h3>
            <FindingsTable findings={(report.review || {}).findings} />
          </section>

          <section>
            <h3 className="text-sm font-semibold text-muted uppercase tracking-wide mb-3">Patches Applied</h3>
            <PatchesSection patches={report.patches} />
          </section>

          <section>
            <h3 className="text-sm font-semibold text-muted uppercase tracking-wide mb-3">Documentation</h3>
            <DocumentationSection doc={report.documentation} />
          </section>

          <section>
            <h3 className="text-sm font-semibold text-muted uppercase tracking-wide mb-3">Agent Trace Timeline</h3>
            <AgentTimeline trace={report.agent_trace} />
          </section>
        </div>
      );
    }

    // ── Main App ──────────────────────────────────────────────────────────
    function App() {
      const [prUrl, setPrUrl] = useState('');
      const [running, setRunning] = useState(false);
      const [status, setStatus] = useState('IDLE');
      const [duration, setDuration] = useState('');
      const [error, setError] = useState('');
      const [nodeStates, setNodeStates] = useState(initialNodeStates);
      const [recentLog, setRecentLog] = useState([]);
      const [report, setReport] = useState(null);
      const [retryActive, setRetryActive] = useState(false);

      const wsRef = useRef(null);
      const timerRef = useRef(null);
      const startTsRef = useRef(null);
      const currentNodeRef = useRef(null);

      const addLog = useCallback((agent, message) => {
        setRecentLog((prev) => {
          const entry = { agent: agent || 'System', message, ts: new Date().toLocaleTimeString() };
          return [...prev.slice(-4), entry];
        });
      }, []);

      const setNode = useCallback((nodeId, state) => {
        if (!nodeId) return;
        setNodeStates((prev) => ({ ...prev, [nodeId]: state }));
      }, []);

      const markPreviousDone = useCallback((activeNodeId) => {
        const idx = NODE_ORDER.indexOf(activeNodeId);
        if (idx <= 0) return;
        setNodeStates((prev) => {
          const next = { ...prev };
          for (let i = 0; i < idx; i++) {
            const id = NODE_ORDER[i];
            if (next[id] === 'RUNNING' || next[id] === 'DONE') next[id] = 'DONE';
          }
          return next;
        });
      }, []);

      const handleAgentProgress = useCallback((agent, message, action) => {
        const nodeId = mapAgentToNode(agent);
        if (!nodeId) return;

        if (action && action.includes('fix_bugs_attempt') && (action.includes('2') || action.includes('3'))) {
          setRetryActive(true);
          setNode('fixer', 'RUNNING');
          setNode('tester', 'WAITING');
        }

        if (action && action.includes('run_tests') && message && message.toLowerCase().includes('fail')) {
          setRetryActive(true);
          setNode('tester', 'FAILED');
          setTimeout(() => setNode('fixer', 'RUNNING'), 400);
        }

        markPreviousDone(nodeId);
        setNode(nodeId, 'RUNNING');
        currentNodeRef.current = nodeId;
        addLog(agent, message);
      }, [setNode, markPreviousDone, addLog]);

      const reset = useCallback(() => {
        setNodeStates(initialNodeStates());
        setRecentLog([]);
        setReport(null);
        setError('');
        setRetryActive(false);
        setDuration('');
        currentNodeRef.current = null;
        if (wsRef.current) { wsRef.current.close(); wsRef.current = null; }
        if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
      }, []);

      const startTimer = () => {
        startTsRef.current = Date.now();
        timerRef.current = setInterval(() => {
          setDuration(((Date.now() - startTsRef.current) / 1000).toFixed(1) + 's');
        }, 100);
      };

      const stopTimer = () => {
        if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
      };

      const startReview = async () => {
        const url = prUrl.trim();
        if (!url) { setError('Please enter a GitHub PR URL.'); return; }
        if (!url.includes('github.com') || !url.includes('/pull/')) {
          setError('URL must be: https://github.com/owner/repo/pull/123');
          return;
        }

        reset();
        setRunning(true);
        setStatus('IN PROGRESS');
        startTimer();

        let sessionId;
        try {
          const resp = await fetch(API + '/api/review', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pr_url: url }),
          });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          const data = await resp.json();
          if (!data.success) throw new Error(data.error || 'Server error');
          sessionId = data.session_id;
        } catch (e) {
          setError('Failed to start: ' + e.message);
          setStatus('ERROR');
          setRunning(false);
          stopTimer();
          return;
        }

        addLog('AutoPilot', 'Pipeline started — session ' + sessionId.slice(0, 8) + '…');
        setNode('fetcher', 'RUNNING');
        currentNodeRef.current = 'fetcher';

        const ws = new WebSocket('ws://localhost:8000/api/ws/' + sessionId);
        wsRef.current = ws;

        ws.onopen = () => addLog('WebSocket', 'Connected — waiting for updates…');

        ws.onmessage = (event) => {
          let msg;
          try { msg = JSON.parse(event.data); } catch { return; }

          if (msg.type === 'start') {
            setNode('fetcher', 'RUNNING');
            addLog('System', msg.message || 'Pipeline running…');

          } else if (msg.type === 'progress') {
            handleAgentProgress(msg.agent, msg.message || msg.action, msg.action);

          } else if (msg.type === 'complete') {
            stopTimer();
            const r = msg.report || {};
            setReport(r);
            const st = r.status || 'PASSED';
            setStatus(st);
            setDuration((r.total_duration_seconds || 0).toFixed(2) + 's');

            const finalStates = {};
            PIPELINE_NODES.forEach((n) => { finalStates[n.id] = 'DONE'; });
            setNodeStates(finalStates);
            setRetryActive(false);
            addLog('AutoPilot', 'Pipeline complete — ' + st);
            setRunning(false);
            ws.close();

          } else if (msg.type === 'error') {
            stopTimer();
            setStatus('ERROR');
            setError(msg.message || 'Pipeline error');
            if (currentNodeRef.current) setNode(currentNodeRef.current, 'FAILED');
            addLog('Error', msg.message);
            setRunning(false);
            ws.close();
          }
        };

        ws.onerror = () => addLog('WebSocket', 'Connection error');
      };

      useEffect(() => () => {
        if (wsRef.current) wsRef.current.close();
        if (timerRef.current) clearInterval(timerRef.current);
      }, []);

      return (
        <div className="max-w-7xl mx-auto px-4 py-8">
          {/* Two columns */}
          <div className="flex flex-col lg:flex-row gap-6">
            {/* Left 40% */}
            <div className="lg:w-[40%] shrink-0">
              <div className="bg-surface border border-border rounded-xl p-6">
                <h1 className="text-2xl font-bold bg-gradient-to-r from-accent to-success bg-clip-text text-transparent mb-1">
                   AutoPilot Dev
                </h1>
                <p className="text-muted text-sm mb-6">Autonomous GitHub PR Review &amp; Bug Fix</p>

                <label className="text-xs uppercase text-muted tracking-wide">GitHub Pull Request</label>
                <input
                  type="url"
                  value={prUrl}
                  onChange={(e) => setPrUrl(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && !running && startReview()}
                  placeholder="https://github.com/owner/repo/pull/123"
                  disabled={running}
                  className="w-full mt-2 mb-4 bg-bg border border-border rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-accent disabled:opacity-50"
                />

                <button
                  onClick={startReview}
                  disabled={running}
                  className="w-full bg-accent hover:bg-accent/90 disabled:opacity-40 text-bg font-bold py-2.5 rounded-lg text-sm transition no-print"
                >
                  {running ? '⏳ Running…' : 'Analyse'}
                </button>

                {error && (
                  <div className="mt-3 text-danger text-sm bg-danger/10 border border-danger/30 rounded-lg px-3 py-2">
                    ⚠ {error}
                  </div>
                )}

                <div className="flex items-center gap-3 mt-5">
                  <span className="text-muted text-sm">Status</span>
                  <span className={`px-3 py-1 rounded-full text-xs font-bold uppercase border ${statusBadgeClass(status)}`}>
                    {formatStatus(status)}
                  </span>
                  {duration && <span className="text-muted text-sm ml-auto font-mono">{duration}</span>}
                </div>
              </div>
            </div>

            {/* Right 60% */}
            <div className="lg:w-[60%]">
              <div className="bg-surface border border-border rounded-xl p-6 h-full">
                <h2 className="text-xs uppercase text-muted tracking-wide mb-4">Live Pipeline</h2>
                <PipelineDiagram nodeStates={nodeStates} retryActive={retryActive} />

                <div className="mt-6 border-t border-border pt-4">
                  <h3 className="text-xs uppercase text-muted tracking-wide mb-2">Recent Activity</h3>
                  {recentLog.length === 0 ? (
                    <p className="text-muted text-sm">Waiting for pipeline events…</p>
                  ) : (
                    <ul className="space-y-1.5">
                      {recentLog.map((entry, i) => (
                        <li key={i} className="text-xs font-mono">
                          <span className="text-muted">{entry.ts}</span>
                          <span className="text-accent ml-2">{entry.agent}</span>
                          <span className="text-muted ml-2">{entry.message}</span>
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
              </div>
            </div>
          </div>

          {/* Report below */}
          {report && <ReportPanel report={report} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
